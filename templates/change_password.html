{% extends "base.html" %}

{% block title %}Change Password | DSA QA Portal{% endblock %}

{% block content %}
<div class="login-wrapper" style="margin-top: 3rem;">
  <div class="login-card">
    <div class="login-header">
      <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔒</div>
      <h1>Change Password</h1>
      <p>Update your account security credentials</p>
    </div>

    <form method="POST" action="{{ url_for('change_password') }}">
      <div class="form-group">
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password" class="form-control" placeholder="Enter current password" required autofocus>
      </div>

      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Minimum 6 characters" required>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
        💾 Save New Password
      </button>
    </form>
  </div>
</div>
{% endblock %}
